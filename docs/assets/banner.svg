<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06121f"/><stop offset="0.55" stop-color="#0b2a44"/><stop offset="1" stop-color="#0d4a6b"/>
    </linearGradient>
    <linearGradient id="tx" x1="0" x2="1">
      <stop offset="0" stop-color="#56c4f0"/><stop offset="1" stop-color="#9be7ff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <g stroke="#56c4f0" stroke-opacity=".08">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M100 0V330M300 0V330M500 0V330M700 0V330M900 0V330M1100 0V330"/>
  </g>
  <circle cx="1030" cy="165" r="120" fill="none" stroke="#56c4f0" stroke-opacity=".25" stroke-width="2">
    <animate attributeName="r" values="110;135;110" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="165" r="80" fill="#56c4f0" fill-opacity=".08"/>
  <g filter="url(#glow)" transform="translate(990 125)" fill="none" stroke="#9be7ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="12" width="80" height="56" rx="8"/><path d="M0 32H80"/><path d="M12 52H34"/>
    <circle cx="62" cy="52" r="5" fill="#e3190f" stroke="none">
      <animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="70" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#e3190f" font-style="italic">Explore · Achieve</text>
  <text x="70" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#tx)" filter="url(#glow)">School Fee</text>
  <text x="70" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Management System</text>
  <text x="72" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9be7ff" letter-spacing="3">Developed by Syed Muhammad Tayyab
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/></text>
</svg>
